<template>
    <lightning-card title="Quote PDF" icon-name="standard:document">
        <div class="slds-p-around_medium">
            <lightning-button
                variant="brand"
                label={buttonLabel}
                disabled={isGenerating}
                onclick={handleRegenerate}>
            </lightning-button>

            <template if:true={showToast}>
                <div class={toastClass} role="status" style="margin-top: 0.5rem;">
                    <div class="slds-notify__content">
                        <p>{toastMessage}</p>
                    </div>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
